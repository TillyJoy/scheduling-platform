<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scheduling Platform</title><style>:root{font-family:system-ui,sans-serif;color:#172033;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,.nav-item{font:inherit}button{border:1px solid #98a2b3;border-radius:8px;background:#fff;padding:10px 14px;cursor:pointer}.shell{max-width:1100px;margin:auto;padding:32px 20px}.shell-centered{min-height:100vh;display:grid;place-items:center}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:24px}.auth-card{width:min(100%,520px)}.eyebrow{margin:0 0 6px;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:700;color:#667085}.muted{color:#667085;font-size:.9rem}.error-state{border-color:#fecdca}.app-header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 24px;background:#fff;border-bottom:1px solid #e4e7ec}.app-header h1{margin:0;font-size:1.3rem}.identity{display:flex;align-items:center;gap:16px}.identity div{display:grid;text-align:right}.identity span{color:#667085;font-size:.8rem}.app-body{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 82px)}.sidebar{padding:20px;border-right:1px solid #e4e7ec;background:#fff}.nav-item{display:grid;gap:2px;padding:12px;border-radius:9px;text-decoration:none;color:#172033;margin-bottom:6px}.nav-item.available{background:#f2f4f7}.nav-item:not(.available){color:#98a2b3;cursor:not-allowed}.nav-item small{font-size:.75rem;color:#667085}.content{padding:24px;max-width:1100px;width:100%}.context-bar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}.context-bar div{min-width:190px;padding:12px 14px;background:#fff;border:1px solid #e4e7ec;border-radius:10px}.context-bar span{display:block;color:#667085;font-size:.75rem}.workspace{min-width:0}@media(max-width:720px){.app-header{align-items:flex-start;flex-direction:column}.identity{width:100%;justify-content:space-between}.identity div{text-align:left}.app-body{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid #e4e7ec;display:flex;gap:6px;overflow:auto;padding:12px}.nav-item{min-width:180px;margin:0}.content{padding:16px}}</style></head><body><div id="root"></div><script src="./auth.js"></script><script src="./appShell.js"></script><script src="./app.js"></script></body></html>
