<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scheduling Platform</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; } header { padding: 20px 24px; background: #172033; color: white; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .card { background: white; border: 1px solid #dce1ea; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    button { padding: 9px 14px; border: 0; border-radius: 6px; cursor: pointer; }
    .primary { background: #315efb; color: white; } .muted { color: #5d6678; } .error { color: #b42318; }
    table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
  </style>
</head>
<body>
  <header><strong>Scheduling Platform</strong><div id="session" class="muted"></div></header>
  <main>
    <section class="card" id="login-card">
      <h1>Sign in</h1>
      <p class="muted">Development authentication is used only for the local MVP workflow.</p>
      <button class="primary" id="login">Sign in as demo user</button>
    </section>
    <section class="card" id="app-card" hidden>
      <h1>Scheduling overview</h1><p id="status" class="muted">Loading...</p>
      <div id="jobs"></div><div id="appointments"></div>
    </section>
    <p id="error" class="error" role="alert"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
