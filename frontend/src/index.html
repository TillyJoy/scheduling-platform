<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduling Platform</title><style>
:root{font-family:system-ui,sans-serif}body{margin:0;background:#f5f7fa;color:#172033}.shell{max-width:1100px;margin:auto;padding:32px 20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{margin:0 0 4px}header p{margin:0;color:#667085}.status{padding:6px 10px;border-radius:999px;background:#e7f6ec}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}article{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:18px;min-height:180px}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef0f3}.row span{color:#667085;font-size:.9rem}
.slot{display:block;width:100%;text-align:left;padding:11px;margin:8px 0;border:1px solid #d0d5dd;background:#fff;border-radius:8px;cursor:pointer}.slot:hover{background:#f8fafc}.slot:disabled{opacity:.6}.error{color:#b42318}
</style></head><body><div id="root"></div><script src="./app.js"></script></body></html>
