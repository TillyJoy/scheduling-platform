name: CI

# Run the same backend test suite for both branch pushes and pull requests.
on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: scheduling_platform_test
        options: >-
          --health-cmd "pg_isready -U postgres -d scheduling_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/scheduling_platform_test
          DATABASE_SSL: "false"
          RUN_POSTGRES_TESTS: 1
        run: npm test

      - name: Run focused field execution tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/scheduling_platform_test
          DATABASE_SSL: "false"
          RUN_POSTGRES_TESTS: 1
        run: node --test tests/fieldVisitService.test.js tests/fieldExecutionSyncService.test.js tests/fieldExecutionSyncApi.test.js tests/fieldExecutionPostgres.integration.test.js

      - name: Run focused property relationship tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/scheduling_platform_test
          DATABASE_SSL: "false"
          RUN_POSTGRES_TESTS: 1
        run: node --test tests/propertyUnitClientRelationshipRepository.test.js tests/propertyUnitClientRelationshipService.test.js tests/propertyUnitClientRelationship.integration.test.js

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Smoke test authenticated browser-facing workflow
        working-directory: frontend
        env:
          NODE_ENV: development
          AUTH_SECRET: mvp-ci-auth-secret-that-is-at-least-32-bytes-long
        run: |
          npm start > /tmp/scheduling-platform.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /tmp/frontend.html; then
              break
            fi
            sleep 1
          done
          grep -q '<title>Scheduling Platform</title>' /tmp/frontend.html
          TOKEN=$(curl --silent --fail -X POST http://127.0.0.1:3000/api/auth/dev-login | node -e 'let s=""; process.stdin.on("data", d => s+=d); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).token))')
          curl --silent --fail -H "Authorization: Bearer $TOKEN" http://127.0.0.1:3000/api/jobs > /tmp/jobs.json
          grep -q 'Demo Client' /tmp/jobs.json
